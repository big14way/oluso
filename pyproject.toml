[project]
name = "oluso"
version = "0.1.0"
description = "Measuring and repairing safety and calibration drift in Nigerian languages, without retraining."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
    "torch>=2.7",
    "transformers>=5.15,<6",
    "accelerate>=1.0",
    "datasets>=3.0",
    "huggingface-hub>=1.5,<2",
    "numpy>=1.26",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "safetune==0.1.12",
    "auditkit==1.1.3",
    "curatorkit[hf,generation]==0.1.22",
    "scikit-learn>=1.4",
    "scipy>=1.11",
]

[project.optional-dependencies]
circuit = ["circuitkit==0.2.0"]
data = [
    "fasttext>=0.9.3",
]

[project.scripts]
oluso = "oluso.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oluso"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks", "cards"]  # cards are published dataset READMEs, kept byte-identical

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs internet to fetch the tiny ungated test model"]
